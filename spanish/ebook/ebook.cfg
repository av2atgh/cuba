% ebook.cfg — tex4ht configuration for the EPUB build.
\Preamble{xhtml}

% Any image tex4ht still decides to generate comes out as SVG; svg2png.py then
% rasterises it, because Amazon's KFX converter rejects SVG. In this book that
% path should stay empty -- every figure is pre-rasterised to PNG before the
% conversion runs -- and the build reports it if that stops being true.
\Configure{Picture}{.svg}

% Note: the book stylesheet (ebook.css) is merged into the auto-generated
% book-ebook.css by build-book.sh after conversion (tex4ebook has no add-CSS
% switch, and raw CSS cannot go through \Css because of % and # characters).

\begin{document}
\EndPreamble
